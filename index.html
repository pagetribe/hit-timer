<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimalist High Intensity Interval Training (HIIT) Timer.">
  <meta name="theme-color" content="#0f172a">
  <title>HIT TIMER - Minimalist HIIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-high-energy">
  <div class="app-container">
    <!-- Ultra-Minimal Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="app-title">HIT <span>TIMER</span></h1>
      </div>
      <div class="header-actions">
        <!-- Theme Selector -->
        <select id="theme-select" class="theme-select" aria-label="Select Theme">
          <option value="theme-high-energy">High Energy</option>
          <option value="theme-cyberpunk">Cyberpunk Neon</option>
          <option value="theme-sunset">Sunset Burn</option>
          <option value="theme-stealth">Stealth Cobalt</option>
        </select>

        <!-- Sound Toggle -->
        <button id="sound-toggle" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <span id="sound-icon">🔊</span>
        </button>

        <!-- Wake Lock Indicator -->
        <div id="wakelock-badge" class="wakelock-badge inactive" title="Wake Lock Status">
          <span class="dot"></span> <span class="badge-text">WAKE LOCK OFF</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="main-layout">
      <!-- Left Column: Setup & Presets -->
      <section id="setup-section" class="setup-panel">
        <div class="panel-header">
          <h2>Timer Setup</h2>
        </div>

        <!-- Minimal Presets Bar -->
        <div class="presets-container">
          <div class="presets-header">
            <span class="preset-label">Presets</span>
            <button id="btn-open-save-preset" class="btn-text-action">+ Save</button>
          </div>
          <div id="built-in-presets" class="presets-grid">
            <button class="preset-chip" data-preset="30-30">30/30</button>
            <button class="preset-chip" data-preset="tabata">Tabata</button>
            <button class="preset-chip" data-preset="boxing">Boxing</button>
            <button class="preset-chip" data-preset="emom">EMOM</button>
          </div>
          <div id="custom-presets-list" class="custom-presets-list"></div>
        </div>

        <!-- Configuration Inputs Grid: Sets & Reps at Position 1 & 2 -->
        <form id="config-form" class="config-grid" onsubmit="return false;">
          <!-- 1. Sets Count -->
          <div class="input-card">
            <div class="card-label">
              <span class="label-title">Sets</span>
              <span class="label-sub">Rounds</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="sets-count" data-change="-1">−</button>
              <div class="input-value-wrapper">
                <input type="number" id="sets-count" min="1" max="99" value="2">
              </div>
              <button type="button" class="btn-step" data-target="sets-count" data-change="1">+</button>
            </div>
          </div>

          <!-- 2. Reps Count -->
          <div class="input-card">
            <div class="card-label">
              <span class="label-title">Reps</span>
              <span class="label-sub">Per set</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="reps-count" data-change="-1">−</button>
              <div class="input-value-wrapper">
                <input type="number" id="reps-count" min="1" max="99" value="4">
              </div>
              <button type="button" class="btn-step" data-target="reps-count" data-change="1">+</button>
            </div>
          </div>

          <!-- 3. Work Interval (Max 60s) -->
          <div class="input-card work-card">
            <div class="card-label">
              <span class="label-title">Work</span>
              <span class="label-badge badge-work">Exercise</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="work-time" data-change="-5">-5s</button>
              <div class="input-value-wrapper">
                <input type="number" id="work-time" min="1" max="60" value="30">
                <span class="unit">s</span>
              </div>
              <button type="button" class="btn-step" data-target="work-time" data-change="5">+5s</button>
            </div>
          </div>

          <!-- 4. Rest Interval (Max 60s) -->
          <div class="input-card rest-card">
            <div class="card-label">
              <span class="label-title">Rest</span>
              <span class="label-badge badge-rest">Break</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="rest-time" data-change="-5">-5s</button>
              <div class="input-value-wrapper">
                <input type="number" id="rest-time" min="0" max="60" value="30">
                <span class="unit">s</span>
              </div>
              <button type="button" class="btn-step" data-target="rest-time" data-change="5">+5s</button>
            </div>
          </div>

          <!-- 5. Break Between Sets (Max 60s) -->
          <div class="input-card set-rest-card">
            <div class="card-label">
              <span class="label-title">Break Between Sets</span>
              <span class="label-badge badge-set-rest">Set Break</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="set-rest-time" data-change="-5">-5s</button>
              <div class="input-value-wrapper">
                <input type="number" id="set-rest-time" min="0" max="60" value="30">
                <span class="unit">s</span>
              </div>
              <button type="button" class="btn-step" data-target="set-rest-time" data-change="5">+5s</button>
            </div>
          </div>

          <!-- 6. Get Ready / Prep Time (Max 60s) -->
          <div class="input-card">
            <div class="card-label">
              <span class="label-title">Prep</span>
              <span class="label-badge badge-prep">Get Ready</span>
            </div>
            <div class="stepper-control">
              <button type="button" class="btn-step" data-target="prep-time" data-change="-1">-1s</button>
              <div class="input-value-wrapper">
                <input type="number" id="prep-time" min="0" max="60" value="5">
                <span class="unit">s</span>
              </div>
              <button type="button" class="btn-step" data-target="prep-time" data-change="1">+1s</button>
            </div>
          </div>
        </form>

        <!-- Summary & Action -->
        <div class="total-summary-card">
          <div class="summary-info">
            <span class="summary-title">Total Workout</span>
            <span id="total-duration-display" class="summary-value">04:35</span>
          </div>
          <div id="summary-breakdown" class="summary-breakdown">
            2 Sets × 4 Reps
          </div>
        </div>

        <button id="start-btn" class="btn-primary-large">
          START WORKOUT
        </button>
      </section>

      <!-- Right Column: Minimal Active Timer Panel -->
      <section id="timer-section" class="timer-panel">
        <!-- SVG Ring Display -->
        <div class="ring-wrapper">
          <svg class="ring-svg" viewBox="0 0 320 320">
            <circle class="ring-track" cx="160" cy="160" r="140"></circle>
            <circle id="ring-progress" class="ring-progress phase-work-stroke" cx="160" cy="160" r="140"></circle>
          </svg>

          <div class="ring-center">
            <span id="phase-badge" class="phase-badge badge-prep">GET READY</span>
            <div id="timer-digits" class="timer-digits">05</div>
            <div id="subtext-status" class="subtext-status">GET READY IN</div>
          </div>
        </div>

        <!-- Minimal Dashboard Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">SET</span>
            <span id="stat-set" class="stat-value">1 / 2</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">REP</span>
            <span id="stat-rep" class="stat-value">1 / 4</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">ELAPSED</span>
            <span id="stat-elapsed" class="stat-value">00:00</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">REMAINING</span>
            <span id="stat-remaining" class="stat-value">04:35</span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="total-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Control Toolbar -->
        <div class="control-toolbar">
          <button id="prev-btn" class="ctrl-btn" title="Previous Phase">⏮</button>
          <button id="play-pause-btn" class="ctrl-btn btn-play-main" title="Play or Pause">
            <span id="play-pause-icon">▶</span>
          </button>
          <button id="next-btn" class="ctrl-btn" title="Next Phase">⏭</button>
          <button id="reset-btn" class="ctrl-btn btn-reset" title="Reset Timer">↺</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Save Preset Modal -->
  <div id="preset-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 class="modal-title">Save Custom Preset</h3>
      <div class="modal-input-group">
        <label for="preset-name-input" class="sr-only">Preset Name</label>
        <input type="text" id="preset-name-input" placeholder="Preset name..." maxlength="30">
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-preset" class="btn-secondary">Cancel</button>
        <button id="btn-save-preset-confirm" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
